name: georisk
description: "GeoPredIA - Evaluación inteligente de riesgos geológicos y socioambientales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Manejo de estado simple con ChangeNotifier (usado en todos los *_provider.dart)
  provider: ^6.1.2

  # Cliente HTTP para las llamadas a los servicios SAP (core/network/sap_api_client.dart)
  dio: ^5.4.3
  file_picker: ^13.1.0
  shared_preferences: ^2.5.5
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/geopredia_logo.jpg